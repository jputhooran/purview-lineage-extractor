version: 1

runtime:
  output_dir: ../artifacts/models
  state_file: ../artifacts/state.json
  manifest_dir: ../artifacts/manifests

publishers:
  purview:
    plugin: purview
    account: ${PURVIEW_ACCOUNT}
    auth:
      type: ${PURVIEW_AUTH_TYPE:-default}
    manage_types: true
    allow_process_fallback: true
    timeout_seconds: 90
    retry:
      max_attempts: 5
      initial_delay_seconds: 1
      maximum_delay_seconds: 30
      jitter_ratio: 0.2

jobs:
  - name: ssis-packages
    extractor: ssis
    source:
      path: ${SSIS_PACKAGE_DIR:-../tests/fixtures}
      include: "*.dtsx"
      exclude:
        - "*.disabled.dtsx"
    publishers:
      - purview
    continue_on_error: true

  - name: warehouse-procedures
    enabled: false
    extractor: sqlserver-stored-procedure
    source:
      server: '${SQLSERVER_HOST:-localhost}'
      database: ${SQLSERVER_DATABASE:-Warehouse}
      schema: ${SQLSERVER_SCHEMA:-dbo}
      backend: auto
      procedures:
        - usp_LoadOrders
    publishers:
      - purview
    continue_on_error: true

  - name: external-etl-models
    enabled: false
    extractor: json-model
    source:
      path: ../incoming-models
      include: "*.json"
      format: auto
    publishers:
      - purview
    continue_on_error: true
