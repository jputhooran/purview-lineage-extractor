[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lineage-utility"
version = "0.1.0"
description = "Config-driven, extensible lineage extraction and Microsoft Purview publishing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
sqlserver = [
    "pyodbc==5.3.0",
    "pythonnet==3.1.0",
    "sqlglot==30.15.0",
]
purview = [
    "azure-identity==1.25.3",
]
all = [
    "azure-identity==1.25.3",
    "pyodbc==5.3.0",
    "pythonnet==3.1.0",
    "sqlglot==30.15.0",
]
dev = [
    "azure-identity==1.25.3",
    "build==1.3.0",
    "pyodbc==5.3.0",
    "pyflakes==3.4.0",
    "pytest==9.1.1",
    "pythonnet==3.1.0",
    "sqlglot==30.15.0",
]

[project.scripts]
lineage-util = "lineage_utility.cli:main"

[project.urls]
Homepage = "https://github.com/jputhooran/purview-lineage-extractor"
Repository = "https://github.com/jputhooran/purview-lineage-extractor.git"
Issues = "https://github.com/jputhooran/purview-lineage-extractor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lineage_utility = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
